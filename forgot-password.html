<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Reset Password - ANVION IT SERVICES</title>
  <meta name="description" content="Reset your ANVION portal password via secure email verification."/>
  <meta name="robots" content="noindex, nofollow"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: { blue: "#007BFF", hover: "#0056b3" },
            surface: "#121317",
            "surface-container": "#1a1b20",
            "on-surface": "#e3e2e7",
            "on-surface-variant": "#a1a1aa",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-black text-on-surface font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-blue selection:text-white">

  <!-- TOP NAV BAR -->
  <header class="border-b border-white/10 bg-surface/80 backdrop-blur-md px-6 py-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-brand-blue font-bold font-display text-xl tracking-wider hover:opacity-90 transition-opacity">
        <span class="material-symbols-outlined text-2xl">shield</span>
        <span>ANVION</span>
      </a>
      <a href="/login" class="text-xs text-white hover:text-brand-blue transition-colors font-semibold flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        <span>Back to Sign In</span>
      </a>
    </div>
  </header>

  <!-- FORGOT PASSWORD CONTAINER -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-surface border border-white/10 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
      
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-brand-blue to-transparent"></div>

      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-brand-blue/10 border border-brand-blue/20 flex items-center justify-center mx-auto mb-4 text-brand-blue shadow-[0_0_20px_rgba(0,123,255,0.2)]">
          <span class="material-symbols-outlined text-3xl">key</span>
        </div>
        <h1 class="text-2xl font-bold font-display text-white tracking-tight">Reset Password</h1>
        <p class="text-xs text-on-surface-variant mt-2 max-w-xs mx-auto">
          Enter your registered email address and we'll transmit a secure recovery link.
        </p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl border text-xs flex items-start gap-3">
        <span id="alertIcon" class="material-symbols-outlined text-base mt-0.5">info</span>
        <div id="alertMessage" class="flex-1 leading-relaxed"></div>
      </div>

      <form id="resetForm" class="space-y-5" novalidate>
        <div>
          <label for="email" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">
            Registered Email Address
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-on-surface-variant text-lg">mail</span>
            <input
              id="email"
              type="email"
              required
              autocomplete="email"
              placeholder="alex@enterprise.com"
              class="w-full rounded-lg border border-white/10 bg-black/60 pl-11 pr-4 py-3 text-sm text-white placeholder:text-white/20 outline-none focus:border-brand-blue focus:ring-1 focus:ring-brand-blue transition-all"
            />
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full py-3.5 bg-brand-blue text-white font-bold text-sm rounded-lg hover:bg-brand-hover transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(0,123,255,0.3)] disabled:opacity-50"
        >
          <span id="btnText">Send Recovery Link</span>
          <span class="material-symbols-outlined text-base">send</span>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-white/10 text-center">
        <a href="/login" class="text-xs text-brand-blue font-semibold hover:underline flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          <span>Return to login page</span>
        </a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-6 border-t border-white/10 text-center text-xs text-on-surface-variant">
    <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p>© 2026 ANVION IT SERVICES. All rights reserved.</p>
      <div class="flex items-center gap-4">
        <a href="/privacy-policy" class="hover:text-white transition-colors">Privacy Policy</a>
        <a href="/terms-of-service" class="hover:text-white transition-colors">Terms of Service</a>
        <a href="/contact" class="hover:text-white transition-colors">Support</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { resetPassword } from '/js/firebase-client.js';

    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!email || !email.includes('@')) {
        alertBox.className = 'mb-6 p-4 rounded-xl border border-red-500/30 bg-red-500/10 text-red-300 text-xs flex items-start gap-3';
        alertIcon.textContent = 'error';
        alertMessage.textContent = 'Please enter a valid email address.';
        alertBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'Dispatching Link...';

      try {
        await resetPassword(email);
      } catch (err) {
        // Suppress to avoid account harvesting
      }

      // Consistent security response: do not disclose whether email exists
      alertBox.className = 'mb-6 p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 text-xs flex items-start gap-3';
      alertIcon.textContent = 'check_circle';
      alertMessage.textContent = 'If an account is associated with this email address, password reset instructions have been dispatched. Please review your inbox and spam folders.';
      alertBox.classList.remove('hidden');

      submitBtn.disabled = false;
      btnText.textContent = 'Send Recovery Link';
      form.reset();
    });
  </script>
</body>
</html>
